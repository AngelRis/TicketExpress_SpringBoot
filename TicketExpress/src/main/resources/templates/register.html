<div xmlns:th="http://www.thymeleaf.org">
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header text-center">
                        <h3>Регистрирај се</h3>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/register}" th:object="${user}"  method="post">
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" id="username" th:value="${user.getUsername()}" th:field="*{username}" class="form-control" name="username" required>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" id="email" th:value="${user.getEmail()}" th:field="*{email}" class="form-control" name="email" required >
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" id="password" th:field="*{password}" name="password" class="form-control" required >
                            </div>

                            <div class="mb-3">
                                <label for="repeatPassword" class="form-label">Repeat Password</label>
                                <input type="password" id="repeatPassword" th:field="*{repeatPassword}" name="repeatPassword" class="form-control" required >
                            </div>

                            <div class="mb-3">
                                <select name="rolesId" multiple th:field="*{rolesId}" required class="form-control mr-2">
                                    <option th:each="role : ${roles}"
                                            th:value="${role.getId()}"
                                            th:text="${role.getName()}"
                                            th:selected="${user.getRolesId()?.contains(role.getId())}"
                                    >
                                    </option>
                                </select>
                            </div>
                            <th:block class="my-2 mx-2" th:if="${error}">
                                <p th:text="${error}" class="alert alert-danger"></p>

                            </th:block>


                            <div class="d-flex justify-content-center gap-2">
                                <button type="submit" class="btn btn-primary">Register</button>
                            </div>
                            <p class="text-center my-3">Имате сметка? - <a class="text-primary" href="/login">Најави се</a></p>


                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>
