<div xmlns:th="http://www.thymeleaf.org">
  <h1 class="text-center">Детали за автобуската станица</h1>
  <div class="row">
    <div id="map" style="height: 400px; width: 700px"
         th:data-latitude="${busStation.getLatitude()}"
         th:data-longitude="${busStation.getLongitude()}"
         th:data-name="${busStation.getName()}"
         th:data-address="${busStation.getAddress()}">
    </div>
    <div class="col pt-5">
      <h3 class="text-center" th:text="${busStation.getName()}"></h3>
      <h4 class="text-center mt-3" th:text="'Телефон: '+${busStation.getPhone()}"> </h4>
    </div>

  </div>

  <script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function() {
      var mapElement = document.getElementById('map');
      var latitude = parseFloat(mapElement.dataset.latitude);
      var longitude = parseFloat(mapElement.dataset.longitude);
      var name = mapElement.dataset.name;
      var address = mapElement.dataset.address;

      var map = L.map('map').setView([latitude, longitude], 16);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
      }).addTo(map);

      var marker = L.marker([latitude, longitude]).addTo(map);

      marker.bindPopup("<b>" + name + "</b><br>" + address).openPopup();
    });
  </script>

</div>
