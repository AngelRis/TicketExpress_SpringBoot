<div xmlns:th="http://www.thymeleaf.org">
    <h1 class="text-center">Креирај го својот билет</h1>
    <form class="d-flex align-items-center  justify-content-around my-5 " th:method="GET" action="/tickets">

        <div class="form-group">
            <label for="startingCityId">Место на поаѓање</label>
            <select id="startingCityId" required  name="startingCityId" class="form-control">
                <option value="" selected disabled>-Избери место-</option>
                <option th:each="city:${cities}"
                        th:value="${city.getId()}"
                        th:text="${city.getName()}"
                        th:selected="${startingCityId==city.getId()}"

                >
                </option>
            </select>
        </div>
        <div class="form-group">
            <label for="finishCityId">Дестинација</label>
            <select id="finishCityId" required name="finishCityId" class="form-control">
                <option value="" selected disabled>-Избери место-</option>
                <option th:each="city:${cities}"
                        th:value="${city.getId()}"
                        th:text="${city.getName()}"
                        th:selected="${finishCityId==city.getId()}"
                >
                </option>
            </select>
        </div>
        <div class="form-group">
            <label for="date">Датум</label>
            <input class="form-control" th:value="${selectedDate}" th:min="${#dates.format(#dates.createNow(), 'yyyy-MM-dd')}"  type="date" name="date" id="date" required>

        </div>
        <div class="align-content-center pt-3">
            <button type="submit" class="btn   btn-primary">Прикажи возни редови</button>
        </div>

    </form>
    <form class=" my-5 " th:method="POST" th:object="${ticket}" action="/tickets">
        <input type="hidden" name="date" th:value="${selectedDate}">
        <table class="table ">
            <thead class="thead-dark">
            <tr >
                <th class="align-content-center" scope="col">#</th>
                <th class="align-content-center" scope="col">Место на поаѓање</th>
                <th class="align-content-center" scope="col">Дестинација</th>
                <th class="align-content-center" scope="col">Време</th>
                <th class="align-content-center" scope="col">Превозник</th>
                <th class="align-content-center" scope="col">Еден правец</th>
                <th class="align-content-center" scope="col">Два правци</th>
                <th></th>

            </tr>
            </thead>
            <tbody>

            <tr th:if="${!timetables.isEmpty()}" th:each="timetable,iterStat:${timetables}">
                <th scope="row" th:text="${iterStat.index+1}">1</th>
                <td th:text="${timetable.getStartingCityName()}"></td>
                <td th:text="${timetable.getFinalCityName()}"></td>
                <td th:text="${timetable.getStartTime()}"></td>
                <td th:text="${timetable.getBusOperatorName}"></td>
                <td th:text="${timetable.getOneWayTicketPrice}+' ден'"></td>
                <td th:text="${timetable.getTwoWayTicketPrice}+' ден'"></td>
                <td><input type="radio" required name="timetableId" th:field="*{timetableId}" th:value="${timetable.getId()}"></td>
            </tr>
            <tr th:if="${timetables.isEmpty()}">
                <td colspan="8">
                    <h5 class="text-center text-dark">Нема билети. Изберете релација и датум.</h5>
                </td>
            </tr>
            </tbody>
        </table>
        <th:block class="mx-auto my-3 " th:if="${error}">
            <p th:text="${error}" class="alert text-center alert-danger"></p>

        </th:block>

        <div th:if="${!timetables.isEmpty()}"  class="form-group my-5 d-flex justify-content-between">
            <div>
                <b class="text-dark">Избери тип на билет:</b><br>
                <label for="two">Во два правци </label><input id="two" class="mx-2" type="radio" th:field="*{roundTripTicket}"  name="roundTripTicket" th:value="true" /><br>
                <label for="one">Во еден правец </label><input id="one" class="mx-2" type="radio" th:field="*{roundTripTicket}"  name="roundTripTicket" th:value="false" /><br>
            </div>
            <div>
                <button type="submit" class="btn btn-primary">Резервирај</button>
            </div>

        </div>




    </form>


</div>
