<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <title th:text="${title}">Master Page</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/webjars/leaflet/1.7.1/leaflet.css" />
</head>

<body style="background-color: #F0F5F6">
<!-- Header -->
<header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" th:href="@{/home}">TicketExpress</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="#" th:href="@{/home}">Дома</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" th:href="@{/busOperators}">Превозници</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ROLE_ADMIN')">
                    <a class="nav-link" href="#" th:href="@{/buses}">Автобуси</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" th:href="@{/busStations}">Автобуски станици</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" th:href="@{/timetables}">Возни редови</a>
                </li>
                <li class="nav-item" >
                    <a class="nav-link" href="#" th:href="@{/tickets}">Билети</a>
                </li>
            </ul>
            <ul class="navbar-nav ml-auto">
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <p class="text-light d-inline" style="font-size: 18px" th:text="${#authentication.getName()}"></p>
                    <a href="/shoppingCart" class="mx-2"><img style="width: 40px;height: 40px" src="/images/shopping_cart.png"></a>
                </li>
                <li class="nav-item " sec:authorize="!isAuthenticated()">
                    <a href="/login" class="btn btn-primary">Најави се</a>
                </li>
                <li class="nav-item " sec:authorize="isAuthenticated()">
                    <a href="/logout" class="btn btn-light">Одјави се</a>
                </li>
            </ul>
        </div>
    </nav>
</header>

<!-- Content Placeholder -->
<section class="w-75 my-5 mx-auto" th:include="${bodyContent}">
</section>

<!-- Footer -->
<footer class="bg-light text-center py-3">
    <p>&copy; 2025 TicketExpress</p>
</footer>

<!-- JavaScript Files -->
<script src="/webjars/leaflet/1.7.1/leaflet.js"></script> <!-- Leaflet библиотека -->
<script src="/js/bootstrap.bundle.min.js"></script> <!-- Bootstrap библиотека -->

</body>
</html>
